name: Build TerminalSnake
run-name: ${{ gitea.actor }} Build TerminalSnake

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - run: echo "Build TerminalSnake triggered by ${{ gitea.event_name }} event."
      
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Restore dependencies
        run: dotnet restore

      - name: Build solution
        run: dotnet build TerminalSnake.sln -c Debug --no-restore

      - name: Test project
        run: dotnet test TerminalSnake/TerminalSnake.csproj -c Debug