name: Build TerminalSnake

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: linux64-latest

    container:
      image: mcr.microsoft.com/dotnet/sdk:9.0

    steps:
      - name: Install Node.js
        run: apt-get update -qq && apt-get install -y nodejs

      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Restore dependencies
        run: dotnet restore

      - name: Build solution
        run: dotnet build TerminalSnake.sln -c Debug --no-restore

      - name: Test project
        run: dotnet test TerminalSnake.Tests/TerminalSnake.Tests.csproj -c Debug --no-restore --logger "console;verbosity=normal"