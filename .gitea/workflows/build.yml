name: Build TerminalSnake

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Restore dependencies
        run: dotnet restore

      - name: Build solution
        run: dotnet build TerminalSnake.sln -c Debug --no-restore

      - name: Test project
        run: dotnet test TerminalSnake/TerminalSnake.csproj -c Debug