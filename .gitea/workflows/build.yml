name: Build TerminalSnake

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: linux64-latest

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build solution
        run: dotnet build TerminalSnake.sln -c Debug --no-restore

      #- name: Test project
      #  run: dotnet test TerminalSnake/TerminalSnake.csproj -c Debug