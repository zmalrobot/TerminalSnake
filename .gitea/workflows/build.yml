name: Build TerminalSnake

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        run: git clone http://127.0.0.1:3000/s.marzola/TerminalSnake.git
        # optionally, checkout correct branch:
        run: git checkout main

      - name: Restore dependencies
        run: dotnet restore

      - name: Build solution
        run: dotnet build TerminalSnake.sln -c Debug --no-restore

      - name: Test project
        run: dotnet test TerminalSnake/TerminalSnake.csproj -c Debug